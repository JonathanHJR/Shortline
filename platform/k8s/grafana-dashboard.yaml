apiVersion: v1
kind: ConfigMap
metadata:
  name: shortline-dashboard
  labels:
    grafana_dashboard: "1"
data:
  shortline.json: |
    {
      "uid": "shortline",
      "title": "Shortline",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Route",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "rate(shortline_http_requests_total[5m])",
              "legendFormat": "{{route}} ({{status}})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Total Requests by Route",
          "type": "stat",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 9 },
          "targets": [
            {
              "expr": "sum by (route) (shortline_http_requests_total)",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
